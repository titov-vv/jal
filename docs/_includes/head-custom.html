<!-- start custom head snippets, customize with your own _includes/head-custom.html file -->

<!-- Setup Google Analytics -->
{% include head-custom-google-analytics.html %}

<!-- Favicon (sources of the mark are in design/icons/) -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/img/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/favicon-180.png' | relative_url }}">

<!-- Card shown when a link to the site is shared -->
<meta property="og:image" content="{{ '/img/social_preview.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ '/img/social_preview.png' | absolute_url }}">

<!-- Privacy-friendly analytics: https://www.goatcounter.com -->
<script data-goatcounter="https://jal.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- end custom head snippets -->
